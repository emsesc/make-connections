    /* NYT Karnak font (served from public/fonts/nyt-karnak.ttf) */

      font-family: 'NYT Franklin Small';
      src: url('/fonts/franklin-normal-300.ttf') format('truetype');

    /* Apply as the site's primary font with sensible fallbacks */
    body {
      font-family: 'NYT Karnak', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
